id: BC-5270
name: Publication Funding Management
level: 1
industry: Academic Publishing
description: The ability to establish and apply publisher-side funding conditions for scholarly publication, including institutional publishing arrangements, author eligibility, publication charges and collective support. Covers articles, books and chapters as well as author-free funding models; reading access and financial settlement remain outside this capability.
references:
  - https://www.esac-initiative.org/about/transformative-agreements/
  - https://www.coalition-s.org/plan_s_principles/
  - https://doaj.org/apply/transparency/
in_scope:
  - Publication funding conditions and author-facing advice
  - Institutional publishing eligibility and charge liability
  - Collective, sponsor and no-author-charge funding
  - Publication funding obligation reconciliation
out_of_scope:
  - Research grant award management
  - Read entitlements under combined agreements (BC-5280)
  - Receivables, cash collection and payments (BC-200)
  - Publisher copyright grants (BC-5260)
