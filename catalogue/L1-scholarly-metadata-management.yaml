id: BC-5250
name: Scholarly Metadata Management
level: 1
industry: Academic Publishing
description: The ability to describe scholarly publications and their relationships consistently for registration, exchange and interpretation by the research and book supply chains. Covers bibliographic and product description, persistent identifiers, attribution, classification and metadata assurance; it does not control publication files or reader discovery placement.
references:
  - https://www.crossref.org/documentation/register-maintain-records/
  - https://www.editeur.org/83/Overview/
  - https://info.orcid.org/documentation/integration-guide/orcid-record/
in_scope:
  - Bibliographic and book-product descriptions
  - Persistent scholarly identifiers and attribution relationships
  - Metadata quality and interoperable records
out_of_scope:
  - Contributor relationship profiles (BC-5210)
  - Publication file and archival custody (BC-5300)
  - Discovery placement or search (BC-5290)
  - Generic enterprise master data management (BC-610)
