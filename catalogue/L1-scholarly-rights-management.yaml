id: BC-5260
name: Scholarly Rights Management
level: 1
industry: Academic Publishing
description: The ability to establish and govern the rights a scholarly publisher acquires and grants in publication content. Covers incoming rights, third-party permissions, publication licences, purpose-specific computational reuse grants and royalty obligations while distinguishing copyright permissions from reading entitlements and publication funding.
references:
  - https://doaj.org/apply/transparency/
  - https://www.coalition-s.org/plan_s_principles/
  - https://www.esac-initiative.org/about/transformative-agreements/
  - https://dev.springernature.com/terms-conditions/
in_scope:
  - Publisher publication and exploitation rights
  - Third-party content permissions and open licence terms
  - Outbound reuse grants and royalty obligation records
  - Purpose-specific computational reuse permissions and restrictions
out_of_scope:
  - Subscription and read agreement administration (BC-5280)
  - Publication charge funding (BC-5270)
  - Royalty payment accounting (BC-200)
  - Corporate legal advice (BC-150)
