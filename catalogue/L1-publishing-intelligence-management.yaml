id: BC-5310
name: Publishing Intelligence Management
level: 1
industry: Academic Publishing
description: The ability to produce trustworthy scholarly usage, engagement and content-value evidence for publishers and institutional partners. It normalises readership and programmatic-consumption evidence, explains coverage and supports responsible interpretation of impact without treating journal-level indicators as a proxy for an individual work or researcher.
references:
  - https://www.countermetrics.org/code-of-practice/
  - https://www.crossref.org/documentation/register-maintain-records/
  - https://www.niso.org/publications/rp-9-2026-kbart
  - https://sfdora.org/read/
  - https://dev.springernature.com/
in_scope:
  - Normalised publication usage measures
  - Distinct programmatic-consumption and purpose-bound use evidence
  - Institutional usage and value reports
  - Contextual scholarly reach and engagement evidence
out_of_scope:
  - Generic enterprise analytics platform (BC-610)
  - Enterprise financial planning (BC-230)
  - Live editorial workflow status (BC-5220)
  - API platform telemetry and commercial billing
