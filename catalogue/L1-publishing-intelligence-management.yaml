  - id: BC-5310.10
    name: Scholarly Usage Measurement
    level: 2
    industry: Academic Publishing
    description: The ability to derive consistent, attributable readership measures and separate programmatic-consumption evidence from publication interactions. It preserves metric definitions, exclusions and coverage so that automated retrieval is not automatically misreported as human reading.
    references:
      - https://www.countermetrics.org/code-of-practice/
      - https://dev.springernature.com/
    in_scope:
      - Normalised publication usage events
      - Qualified and de-duplicated usage measures
      - Measurement provenance
      - Purpose-bound machine-consumption evidence and exclusions
    out_of_scope:
      - Serving publications (BC-5290)
      - Generic telemetry platform operations (BC-610)
