      - id: BC-5310.10.40
        name: Programmatic Consumption Evidence
        level: 3
        industry: Academic Publishing
        description: The ability to retain evidence of automated scholarly content consumption by work, corpus, delegated beneficiary and permitted purpose, with delivery and exclusion provenance. It reports programmatic consumption distinctly from qualified human readership and does not infer permission to reuse content from a retrieval event.
        references:
          - https://dev.springernature.com/
          - https://dev.springernature.com/terms-conditions/
          - https://www.countermetrics.org/code-of-practice/
        in_scope:
          - Purpose- and beneficiary-scoped computational consumption evidence
          - Corpus delivery and excluded-item reconciliation
        out_of_scope:
          - Generic API operations and request throttling
          - Licence and reuse grants (BC-5260) and access authorisation (BC-5280)
          - Automatic classification of machine retrieval as human reading
