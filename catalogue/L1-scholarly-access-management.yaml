  - id: BC-5280.40
    name: Access Authorisation Management
    level: 2
    industry: Academic Publishing
    description: The ability to make and explain publication access decisions from the entitlement catalogue and verified beneficiary, delegation and purpose attributes. It resolves access exceptions for human and programmatic consumers without becoming an identity service or publication delivery channel.
    references:
      - https://www.niso.org/publications/rp-9-2026-kbart
      - https://www.esac-initiative.org/about/transformative-agreements/
      - https://dev.springernature.com/terms-conditions/
    in_scope:
      - Item-level permit or deny decisions for human and delegated computational consumers
      - Purpose-bound access scope and expiry for delegated consumers
      - Reasoned access exceptions
      - Decision evidence for disputed access
    out_of_scope:
      - Authentication of a reader (BC-620.20)
      - Serving publication files (BC-5290)
      - Reuse permission or model-training rights (BC-5260)
