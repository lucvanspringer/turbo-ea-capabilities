      - https://www.esac-initiative.org/about/transformative-agreements/
      - https://dev.springernature.com/terms-conditions/
    in_scope:
      - Institutional and consortial read coverage
      - Individual subscription coverage
      - Contracted scope of programmatic content access
      - Collection holdings by title and coverage period
    out_of_scope:
      - Publishing benefits in combined agreements (BC-5270)
      - Outbound reuse grants (BC-5260)
