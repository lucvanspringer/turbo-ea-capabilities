  - id: BC-5280.30
    name: Beneficiary Eligibility Management
    level: 2
    industry: Academic Publishing
    description: The ability to determine whether a human reader or a delegated computational consumer falls within a licensed institutional, consortial or individual beneficiary population. It governs affiliation, delegation, permitted purposes and evidence, not the technical proof of identity.
    references:
      - https://www.esac-initiative.org/about/transformative-agreements/
      - https://www.niso.org/publications/rp-9-2026-kbart
      - https://dev.springernature.com/terms-conditions/
    in_scope:
      - Institutional affiliation rules
      - Consortium membership coverage
      - Individual subscriber standing
      - Delegated machine-consumer authority, represented beneficiary and approved purpose
    out_of_scope:
      - Credential authentication and federation (BC-620.20)
      - Author publishing eligibility (BC-5270)
      - Rights to mine, train on or redistribute content (BC-5260)
