id: BC-5280
name: Scholarly Access Management
level: 1
industry: Academic Publishing
description: The ability to establish and honour who may read each scholarly publication under institutional and individual arrangements, including durable access after cancellation. It maintains licence coverage, publication entitlements, human and delegated machine-consumer eligibility, and purpose-bound access decisions without owning identity authentication or content delivery.
references:
  - https://www.niso.org/publications/rp-9-2026-kbart
  - https://www.esac-initiative.org/about/transformative-agreements/
  - https://doaj.org/apply/transparency/
  - https://dev.springernature.com/terms-conditions/
in_scope:
  - Licensed title, collection and date-range coverage
  - Publication and beneficiary entitlements, including delegated computational consumers
  - Continuing access obligations
out_of_scope:
  - Publishing funding eligibility (BC-5270)
  - Copyright and computational reuse grants (BC-5260)
  - Identity authentication (BC-620.20)
  - Content delivery (BC-5290) and archive custody (BC-5300)
