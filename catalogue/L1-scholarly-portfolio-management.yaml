# Scholarly Portfolio Management
id: BC-5200
name: Scholarly Portfolio Management
level: 1
industry: Academic Publishing
description: The ability to shape and sustain a coherent portfolio of scholarly journals, books, proceedings and collections for defined research communities. It governs commissioning opportunities and commitments and thematic collection stewardship without determining the fate of submitted manuscripts.
references:
  - https://doaj.org/apply/transparency/
  - https://www.doabooks.org/en/publishers/
  - https://asset.routledge.com/rt-files/AUTHOR/Guidelines/Proposal+guidelines.pdf
  - https://researcher-resources.acs.org/publish/special_issue
  - https://publicationethics.org/guidance/guideline/guest-edited-collections
in_scope:
  - Title and programme positioning
  - Commission prospect, proposal and commitment stewardship
  - Thematic collection remit, membership and lifecycle
  - Publishing partnership scope and title lifecycle
out_of_scope:
  - Individual submitted manuscript assessment and acceptance (BC-5220)
  - Contributor relationship profiles and expertise (BC-5210)
  - Bibliographic attribution and subject metadata (BC-5250)
  - Collection release, search and promotion (BC-5290)
  - Publishing impact measurement (BC-5310)
  - Publication funding agreements (BC-5270) and reading licences (BC-5280)
