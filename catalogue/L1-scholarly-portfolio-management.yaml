      - https://www.springernature.com/gp/authors/publish-an-article/collections
      - https://publicationethics.org/guidance/guideline/guest-edited-collections
    in_scope:
      - Collection remit, eligibility and duration
      - Curated membership and change history for new and previously published work
      - Guest editor role and collection-specific oversight
      - Collection continuation, closure and withdrawal decisions
    out_of_scope:
