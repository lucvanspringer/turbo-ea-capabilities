  - id: BC-5200.20
    name: Content Commissioning Management
    level: 2
    industry: Academic Publishing
    description: Secures prospective scholarly contributions against portfolio needs, from contributor fit and proposals to agreed commissioning obligations and their subsequent disposition. The commission record remains intelligible across submission channels and programme changes.
    references:
      - https://asset.routledge.com/rt-files/AUTHOR/Guidelines/Proposal+guidelines.pdf
