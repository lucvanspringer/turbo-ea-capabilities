      - Accept, revise or decline disposition and rationale
      - Revision requirements and evaluation of their satisfaction
    out_of_scope:
      - Publication ethics and integrity policy or findings (BC-5230)
      - Proposal synopsis appraisal before manuscript submission (BC-5200)
