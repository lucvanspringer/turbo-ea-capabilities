# Manuscript Assessment Management
id: BC-5220
name: Manuscript Assessment Management
level: 1
industry: Academic Publishing
description: The ability to assess submitted scholarly works for admissibility and merit, obtain independent expert evidence and reach accountable editorial decisions. It covers articles, books, chapters and proceedings, including editorial transfer and appeal, without owning publication-integrity findings.
references:
  - https://publicationethics.org/guidance/guideline/ethical-guidelines-peer-reviewers
  - https://doaj.org/apply/transparency/
in_scope:
  - Submission admissibility and editorial assessment
  - Peer review assignment and evidence
  - Editorial decisions, transfer and merit appeals
out_of_scope:
  - Contributor relationship roster (BC-5210)
  - Publication-integrity findings (BC-5230)
  - Copyediting and proof control (BC-5240)
