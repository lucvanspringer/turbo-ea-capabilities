id: BC-5290
name: Scholarly Dissemination Management
level: 1
industry: Academic Publishing
description: The ability to make released scholarly works available through publication channels, discovery services and reader experiences. It covers publication-channel and print-edition commitments, governed machine-consumable corpus supply, indexing participation, search and reader engagement without owning entitlement decisions or long-term preservation.
references:
  - https://www.doabooks.org/en/publishers/
  - https://www.niso.org/publications/rp-9-2026-kbart
  - https://www.editeur.org/83/Overview/
  - https://www.w3.org/TR/WCAG22/
  - https://dev.springernature.com/
in_scope:
  - Publication-channel release and fulfilment commitments
  - Machine-consumable content supply with coverage and provenance assurance
  - Index and discovery availability
  - Reader search, recommendation and engagement
out_of_scope:
  - Publication entitlement determination (BC-5280)
  - Metadata semantics (BC-5250)
  - Archival preservation (BC-5300)
  - Usage measurement (BC-5310)
  - Generic print production and warehouse fulfilment
