      - https://authorservices.taylorandfrancis.com/publishing-your-research/after-publication/ordering-print-copies/
    in_scope:
      - Reader and partner publication supply obligations
      - Print-edition channel commitments and exceptions
      - Author reprint and scholarly poster order fulfilment
      - Machine-consumable corpus coverage, provenance and excluded-item evidence
    out_of_scope:
      - Entitlement decisions (BC-5280)
      - Manufacturing, inventory and warehouse execution
      - API platform operation, pricing and metering
