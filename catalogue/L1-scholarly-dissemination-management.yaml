  - id: BC-5290.20
    name: Channel Fulfilment Management
    level: 2
    industry: Academic Publishing
    description: The ability to meet scholarly publication-delivery commitments to approved readers, partners, authors and computational consumers. It governs supply scope, author reprint and poster orders, and corpus completeness without operating a printing plant, generic logistics, access policy or API infrastructure.
    references:
      - https://www.editeur.org/83/Overview/
      - https://jats.nlm.nih.gov/
      - https://www.w3.org/TR/epub-a11y-11/
