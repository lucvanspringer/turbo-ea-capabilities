      - id: BC-5290.20.20
        name: Corpus Coverage Assurance
        level: 3
        industry: Academic Publishing
        description: The ability to verify that a machine-consumable selection of licensed or open scholarly content has traceable work and version identifiers, rights and entitlement provenance, exclusions and completeness against the agreed corpus. APIs, bulk transfer or agent interfaces may implement supply but are not capabilities in themselves.
        references:
          - https://dev.springernature.com/
          - https://dev.springernature.com/terms-conditions/
        in_scope:
          - Machine-consumable full-text and metadata corpus coverage
          - Version, licence and source provenance with omissions and delivery exceptions
        out_of_scope:
          - Content structuring and metadata semantics (BC-5240, BC-5250)
          - Rights grants (BC-5260) and consumer entitlement decisions (BC-5280)
