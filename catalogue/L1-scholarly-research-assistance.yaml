id: BC-5320
name: Scholarly Research Assistance
level: 1
industry: Academic Publishing
description: The ability to assist researchers in understanding and synthesising scholarly evidence and developing their own
  pre-submission manuscripts. It preserves human responsibility, source inspectability and control of entrusted material;
  assistance is neither authorship nor a guarantee of accuracy or publication.
references:
  - https://elicit.com/
  - https://scite.ai/
  - https://www.scholarcy.com/
  - https://writefull.com/
  - https://www.icmje.org/recommendations/browse/roles-and-responsibilities/defining-the-role-of-authors-and-contributors.html
in_scope:
  - Researcher-directed evidence comprehension and synthesis
  - Researcher-directed pre-submission writing support
  - Reviewable and attributable assistance
out_of_scope:
  - Scientific research execution
  - Scholarly discovery and recommendation (BC-5290)
  - Publication ethics adjudication (BC-5230)
  - Postacceptance production (BC-5240)
  - Published record preservation (BC-5300)
