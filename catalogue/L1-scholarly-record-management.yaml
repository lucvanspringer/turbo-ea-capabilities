id: BC-5300
name: Scholarly Record Management
level: 1
industry: Academic Publishing
description: The ability to steward the authoritative assets, version relationships and long-term continuity of published scholarly works. It retains evidence of what was published and applies approved amendments while distinguishing live hosting, operational backup and durable preservation.
references:
  - https://www.crossref.org/documentation/register-maintain-records/
  - https://clockss.org/
  - https://publicationethics.org/guidance/guideline/retraction-guidelines
  - https://www.niso.org/standards-committees/transfer
in_scope:
  - Authoritative publication asset custody
  - Version and manifestation lineage
  - Archival preservation
  - Approved record-amendment implementation
out_of_scope:
  - Integrity findings and amendment decisions (BC-5230)
  - Production transformations (BC-5240)
  - Bibliographic metadata semantics (BC-5250)
  - Reading licence entitlement (BC-5280)
