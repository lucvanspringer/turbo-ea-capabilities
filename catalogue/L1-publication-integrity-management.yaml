  - id: BC-5230.50
    name: Scholarly Record Remedy Governance
    level: 2
    industry: Academic Publishing
    description: Governs publisher-side remedy decisions for a published scholarly work or related works, including whether a correction, expression of concern or retraction is justified. Records the rationale, affected-work scope and notice decision without implementing the amendment.
    references:
      - https://publicationethics.org/guidance/guideline/retraction-guidelines
    in_scope:
      - Correction determination for a material error
      - Expression of concern for unresolved credible questions
      - Retraction determination and affected-work scope
      - Remedy rationale and notice authority
    out_of_scope:
      - Execution of approved record changes (BC-5300)
      - Release of revised content to channels (BC-5290)
