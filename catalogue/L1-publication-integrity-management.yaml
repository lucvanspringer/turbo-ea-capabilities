# Publication Integrity Management
id: BC-5230
name: Publication Integrity Management
level: 1
industry: Academic Publishing
description: The ability to set publication-ethics expectations, assure research and authorship declarations, examine authenticity concerns and determine appropriate remedies for the scholarly record. It owns publisher-side integrity findings rather than institutional investigations or implementation of approved record changes.
references:
  - https://publicationethics.org/guidance/guideline/retraction-guidelines
  - https://doaj.org/apply/transparency/
  - https://publicationethics.org/guidance/guideline/ethical-guidelines-peer-reviewers
in_scope:
  - Publication ethics policy and declaration assurance
  - Content authenticity and integrity cases
  - Correction, retraction and concern determinations
out_of_scope:
  - Editorial merit appeals (BC-5220)
  - Research institution misconduct investigations
  - Implementation and preservation of amended records (BC-5300)
