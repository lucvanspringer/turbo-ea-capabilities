# Scholarly Community Management
id: BC-5210
name: Scholarly Community Management
level: 1
industry: Academic Publishing
description: The ability to sustain trustworthy participation by external authors, editors and reviewers across scholarly publishing programmes. It stewards relationship context, expertise, recruitment and engagement independent of staff employment or individual manuscript decisions.
references:
  - https://publicationethics.org/guidance/guideline/ethical-guidelines-peer-reviewers
  - https://info.orcid.org/documentation/integration-guide/orcid-record/
in_scope:
  - External contributor relationships and expertise profiles
  - Editor and reviewer recruitment
  - Community participation and engagement
out_of_scope:
  - Commission-specific invitation and proposal cases (BC-5200.20)
  - Individual peer-review assignment and conflict assessment (BC-5220)
  - Bibliographic contributor attribution (BC-5250)
  - Staff human resources management
