id: BC-5240
name: Scholarly Production Management
level: 1
industry: Academic Publishing
description: The ability to prepare accepted scholarly content as accurate, usable and accessible publication outputs across articles, books, chapters and proceedings. Covers editorial production, renditions, proof control and release-ready quality, but not ownership of the durable scholarly record or distribution to channels.
references:
  - https://jats.nlm.nih.gov/
  - https://www.w3.org/TR/epub-a11y-11/
in_scope:
  - Publication-ready text, figures and supplementary content
  - Accessible article, book and digital renditions
  - Controlled proofs and production acceptance
out_of_scope:
  - Editorial acceptance and peer review (BC-5220)
  - Bibliographic metadata semantics (BC-5250)
  - Long-term publication asset stewardship (BC-5300)
  - Release delivery and print factory operations (BC-5290; Cross-Industry/Manufacturing)
